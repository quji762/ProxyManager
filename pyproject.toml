[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "proxy-manager"
# Single source of truth: setuptools reads the version from config_store.py's
# APP_VERSION (attr directive below), so bump the version in exactly one place.
dynamic = ["version"]
description = "One-click proxy management for PowerShell, Windows system proxy, WSL, Git, npm, and pip on Windows"
license = "MIT"
authors = [{ name = "MasqueradeQ" }]
requires-python = ">=3.11"
dependencies = [
    "pywebview>=5.0,<7.0",
    "pythonnet>=3.0,<4.0",
    "psutil>=5.9,<7.0",
    "pystray>=0.19,<1.0",
    # 13.0.0 is the first release patching the image-parser CVE line
    # Dependabot reported; it needs Python >= 3.11 (requires-python above).
    "Pillow>=13.0,<14.0",
]

[tool.setuptools.dynamic]
version = { attr = "config_store.APP_VERSION" }

# The project ships as a PyInstaller EXE (build.bat), never as a wheel;
# this only exists so the dynamic version resolves. ui/ and assets/ are
# data dirs, not packages — tell setuptools to ignore the flat layout.
[tool.setuptools]
py-modules = ["app", "config_store", "js_api", "messages", "proxy_manager",
              "tray_icon", "window_win32"]
include-package-data = false

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0",
]
build = [
    "pyinstaller>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "PIE", "RET", "SIM"]
# SIM105 (contextlib.suppress) is intentionally off: in the registry/WSL/DPAPI
# write paths the explicit try/except/pass keeps "we deliberately ignore this
# failure" greppable next to its rationale comment.
ignore = ["SIM105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
