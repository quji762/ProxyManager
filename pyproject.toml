[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "proxy-manager"
version = "0.1.0"
description = "One-click proxy management for PowerShell, Windows system proxy, WSL, Git, npm, and pip on Windows"
license = "MIT"
authors = [{ name = "MasqueradeQ" }]
requires-python = ">=3.9"
dependencies = [
    "pywebview>=5.0",
    "pythonnet>=3.0",
    "psutil>=5.9",
    "pystray>=0.19",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
]
build = [
    "pyinstaller>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
