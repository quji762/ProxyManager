name: CI

# docs-only pushes/PRs skip CI — no test or script reads README*/docs
# (verified: tests/ never touch markdown). workflow_dispatch always runs.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      # Deliberately NOT `pip install -e .[dev]`: the dynamic version
      # (attr = config_store.APP_VERSION) makes setuptools import config_store
      # at metadata time, executing the module-level WinDLL loads — and could
      # resolve a stale installed dist-info. tests/ import from the source
      # tree (conftest.py puts the root on sys.path), so a plain requirements
      # install is all that's needed. pytest/ruff are pinned to exact versions
      # (stricter than the [dev] extra's ranges) so a new pytest or ruff
      # release cannot turn a green build red without a commit bumping it.
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "pytest==9.2.0" "ruff==0.17.4"
      - name: Lint (ruff)
        run: ruff check .
      - name: Smoke tests
        run: python -m pytest tests/ -q
