name: Build & Release

on:
  push:
    tags:
      - "v*"
  # Manual rerun after a failed tag validation / build (the tag event does not
  # repeat on its own). Pass the existing tag so the version check below and
  # the checkout both target the tagged tree, not the current branch.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. v1.4.0 (must match config_store.APP_VERSION)"
        required: true
        type: string

# Single job builds AND publishes in one step: the EXE goes straight from
# dist/ to the GitHub Release, so no intermediate Actions Artifact is needed
# and the write permission cannot be narrowed without re-adding one.
permissions:
  contents: write

# Serialize releases per ref; never cancel an in-flight official release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # github.ref_name is the tag on a push event and the branch on a
          # manual run; the explicit input wins when one is given.
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      # APP_VERSION is the single source of truth (pyproject reads it via
      # [tool.setuptools.dynamic] attr). The literal is parsed statically
      # instead of importing config_store: an import would execute the
      # module-level WinDLL loads and could resolve a stale installed
      # proxy-manager dist-info rather than this checkout's source — the
      # AST read always reflects the tagged tree. Catches tag/APP_VERSION
      # drift (e.g. tag v1.5.0 over code still at 1.4.0) before a wrong
      # EXE ships.
      - name: Validate tag matches APP_VERSION
        shell: python
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          import ast, os, sys

          version = None
          tree = ast.parse(open("config_store.py", encoding="utf-8").read())
          for node in ast.walk(tree):
              targets = node.targets if isinstance(node, ast.Assign) else (
                  [node.target] if isinstance(node, ast.AnnAssign) and node.value else [])
              for t in targets:
                  if (isinstance(t, ast.Name) and t.id == "APP_VERSION"
                          and isinstance(node.value, ast.Constant)
                          and isinstance(node.value.value, str)):
                      version = node.value.value
          if not version:
              print("::error::APP_VERSION string literal not found in config_store.py")
              sys.exit(1)
          tag = os.environ["TAG"]
          tagged = tag[1:] if tag.startswith("v") else tag
          print(f"APP_VERSION={version} tag={tag}")
          if version != tagged:
              print(f"::error::Tag {tag} does not match config_store.APP_VERSION {version} "
                    "(bump APP_VERSION before tagging)")
              sys.exit(1)

      # Single source of packaging truth: same script as the local build,
      # so the PyInstaller arguments cannot drift between the two.
      - name: Build EXE
        run: build.bat
        shell: cmd

      - name: Verify build output
        shell: pwsh
        run: |
          if (!(Test-Path dist/ProxyManager.exe)) {
            Write-Host "::error::dist/ProxyManager.exe not found"
            exit 1
          }
          $size = (Get-Item dist/ProxyManager.exe).Length
          if ($size -le 0) {
            Write-Host "::error::dist/ProxyManager.exe is empty"
            exit 1
          }
          Write-Host "ProxyManager.exe size: $size bytes"

      # package.bat is the only place that invokes ISCC, so local and CI
      # installer arguments cannot drift. The onefile exe stays the input;
      # the release publishes the portable copy and the per-user installer.
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe"
          )
          if ($candidates | Where-Object { Test-Path $_ }) { exit 0 }
          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
            Write-Host "::error::choco is not on PATH and ISCC.exe was not found"
            exit 1
          }
          # 3010 = success, reboot requested. The compiler is already usable.
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) { exit $LASTEXITCODE }
          exit 0

      - name: Package installer and portable exe
        run: package.bat
        shell: cmd

      - name: Verify release artifacts
        shell: pwsh
        run: |
          foreach ($name in @("ProxyManager-portable.exe", "ProxyManager-setup.exe")) {
            $path = Join-Path dist $name
            if (!(Test-Path $path)) {
              Write-Host "::error::$path not found"
              exit 1
            }
            $size = (Get-Item $path).Length
            if ($size -le 0) {
              Write-Host "::error::$path is empty"
              exit 1
            }
            Write-Host "$name size: $size bytes"
          }

      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          $lines = @(
            "ProxyManager-portable.exe",
            "ProxyManager-setup.exe"
          ) | ForEach-Object {
            $hash = (Get-FileHash (Join-Path dist $_) -Algorithm SHA256).Hash.ToLower()
            "$hash  $_"
          }
          $lines | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      # Dependency attestation: record the exact package set the EXE was built
      # from (requirements are range-pinned, so each build resolves fresh).
      # Publishing the freeze next to the binary makes every release's
      # dependency closure auditable; hash-pinned lock is the next hardening
      # step if supply-chain requirements grow.
      - name: Record resolved dependencies
        shell: pwsh
        run: python -m pip freeze --exclude-editable | Out-File -Encoding ascii dist/requirements-freeze.txt

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          body: |
            Two Windows builds of the same program. Neither file is code-signed, so Windows SmartScreen may warn the first time you open it. Compare each file with `SHA256SUMS.txt` before running it.

            - **ProxyManager-setup.exe** — per-user installer. It does not ask for administrator rights, installs under `%LOCALAPPDATA%\Programs\ProxyManager`, and does not turn autostart on.
            - **ProxyManager-portable.exe** — the same program as a single file. Settings still live in `%APPDATA%\ProxyManager`.
          files: |
            dist/ProxyManager-setup.exe
            dist/ProxyManager-portable.exe
            dist/SHA256SUMS.txt
            dist/requirements-freeze.txt
          generate_release_notes: true
