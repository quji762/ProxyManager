name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Single source of packaging truth: same script as the local build,
      # so the PyInstaller arguments cannot drift between the two.
      - name: Build EXE
        run: build.bat
        shell: cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxyManager
          path: dist/ProxyManager.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ProxyManager.exe
          generate_release_notes: true
